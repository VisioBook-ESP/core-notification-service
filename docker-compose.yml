services:
  nats:
    image: nats:2-alpine
    container_name: nats-notifications
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring HTTP endpoint
    command: ["--jetstream", "--http_port", "8222"]
    networks:
      - visiobook-network

  core-notification-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: core-notification-service
    ports:
      - "8088:8088"
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: visiobook
      DATABASE_PASSWORD: visiobook_dev_password
      DATABASE_NAME: notifications_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_key_dev
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      NATS_URL: nats://nats:4222
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - visiobook-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-notifications
    environment:
      POSTGRES_USER: visiobook
      POSTGRES_PASSWORD: visiobook_dev_password
      POSTGRES_DB: notifications_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiobook -d notifications_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visiobook-network

  redis:
    image: redis:7-alpine
    container_name: redis-notifications
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - visiobook-network

networks:
  visiobook-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
