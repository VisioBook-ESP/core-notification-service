name: CI/CD

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run format:check
        name: Check code formatting with Prettier

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint:check
        name: Lint TypeScript and JavaScript

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run type-check
        name: Type check with TypeScript

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: visiobook
          POSTGRES_PASSWORD: visiobook_dev_password
          POSTGRES_DB: notifications_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U visiobook"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_USER: visiobook
      TEST_DATABASE_PASSWORD: visiobook_dev_password
      TEST_DATABASE_NAME: notifications_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run test -- --coverage
        name: Run unit tests with coverage

  build:
    runs-on: ubuntu-latest
    needs: [prettier, lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
        name: Build NestJS application

  health-check-dev:
    runs-on: ubuntu-latest
    needs: [prettier, lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Compose
        run: docker compose up --build -d
      - name: Wait for service to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8088/api/v1/health; then
              echo "Service is healthy!"
              curl http://localhost:8088/api/v1/ready
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          echo "Service did not become healthy in time."
          docker compose logs
          exit 1
      - name: Run basic endpoint tests
        run: |
          curl -v http://localhost:8088/api/docs || exit 1
      - name: Cleanup
        run: docker compose down
        if: always()

  build-docker-image-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [prettier, lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t core-notification-service:prod -f Dockerfile .
      - name: Run production container
        run: docker run -d --name core-notification-service-prod -p 8088:8088 -e NODE_ENV=production core-notification-service:prod
      - name: Health check in production
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8088/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for health endpoint... ($i/30)"
            sleep 2
          done
          echo "Health check failed!"
          docker logs core-notification-service-prod
          exit 1
      - name: Cleanup container
        run: docker rm -f core-notification-service-prod
        if: always()

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
